name: Deploy Vite React App to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./panchvaktra-foundation
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Build project
        run: npm run build
      - name: Fix asset paths for subfolder
        run: >
          node -e '
          const fs = require("fs");
          const path = require("path");
          function walk(dir) {
            for (const f of fs.readdirSync(dir)) {
              const p = path.join(dir, f);
              if (fs.statSync(p).isDirectory()) walk(p);
              else if (/\.(html|js|css)$/.test(p)) {
                let c = fs.readFileSync(p, "utf8");
                c = c.replace(/(src|href|url)\s*([=:(])\s*(["\x27])\/(?!\/|panchvaktrawelfarefoundation\/)/g, "$1$2$3/panchvaktrawelfarefoundation/");
                c = c.replace(/(["\x27])\/(?!\/|panchvaktrawelfarefoundation\/)([^"\x27]+\.(?:png|jpg|jpeg|webp|svg|gif|ico))/gi, "$1/panchvaktrawelfarefoundation/$2");
                fs.writeFileSync(p, c);
              }
            }
          }
          walk("dist");
          '
      - name: Prepare static fallback
        run: cp dist/client/index.html dist/client/404.html || cp dist/index.html dist/404.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./panchvaktra-foundation/dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
