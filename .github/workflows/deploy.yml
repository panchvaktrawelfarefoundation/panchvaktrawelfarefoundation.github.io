name: Deploy Vite React App to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./panchvaktra-foundation
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Build project
        run: npm run build
      - name: Fix asset paths for subfolder
        run: |
          find dist -type f \( -name "*.html" -o -name "*.js" -o -name "*.css" \) -exec sed -i -E 's|(src|href)="/([^/])|\1="/panchvaktrawelfarefoundation/\2|g' {} +
          find dist -type f \( -name "*.html" -o -name "*.js" -o -name "*.css" \) -exec sed -i 's|/panchvaktrawelfarefoundation/panchvaktrawelfarefoundation/|/panchvaktrawelfarefoundation/|g' {} +
      - name: Prepare static fallback
        run: cp dist/client/index.html dist/client/404.html || cp dist/index.html dist/404.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./panchvaktra-foundation/dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
